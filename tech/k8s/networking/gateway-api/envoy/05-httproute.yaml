# =============================================================================
# HTTPRoute - ĐỊNH TUYẾN shop.example.com VÀO Service(shop)
# =============================================================================
# Vai trò: nối Gateway(main-gateway) tới ứng dụng, và là "neo" cho 2 policy mức
# route (SecurityPolicy shop-api-auth, BackendTrafficPolicy shop-api-ratelimit).
#
#   Gateway(main-gateway, gateway-infra)
#        ▲ parentRefs (cross-namespace: cần Gateway cho phép qua allowedRoutes)
#        │
#   HTTPRoute(shop-api, app-team) ──backendRefs──> Service(shop):https  (cùng ns app-team)
#        ▲
#        │ targetRefs (mức route)
#        ├── SecurityPolicy(shop-api-auth)        06-security-policy.yaml
#        └── BackendTrafficPolicy(shop-api-ratelimit)  07-backend-traffic-policy.yaml
#
# TIỀN ĐỀ (do app-team tự tạo, không nằm trong bộ example này):
#   - Service "shop" trong ns app-team, có cổng tên "https" (vd 8443) backend tự serve TLS.
#     (HTTPRoute trỏ vào cổng "https" này; BackendTLSPolicy verify cert của nó.)
#   - Namespace app-team phải có nhãn gateway-access=true để attach vào listener https.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-api                            # tên được tham chiếu bởi SecurityPolicy + BackendTrafficPolicy (targetRefs)
  namespace: app-team
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-infra                # bắt buộc khi Gateway ở namespace khác
    sectionName: https                      # chỉ attach vào listener "https"; bỏ field = attach mọi listener (kể cả http)

  hostnames:
  - "shop.example.com"                      # phải nằm trong "*.example.com" của listener, nếu không route bị từ chối

  rules:
  # Rule 1 - canary theo header. Thắng match nhờ ĐỘ CỤ THỂ, KHÔNG phải nhờ đặt trước:
  # Gateway API xếp ưu tiên exact path > prefix dài hơn > method > nhiều header match hơn >
  # nhiều query match hơn; thứ tự trong list chỉ là tie-break CUỐI. Request x-env=canary khớp
  # cả 2 rule nhưng rule này có 1 header match (rule 2 có 0) nên cụ thể hơn -> thắng dù đảo thứ tự.
  - matches:
    - headers:
      - type: Exact
        name: x-env
        value: canary
    backendRefs:
    - name: shop-canary
      port: 8443
    timeouts:                               # canary cũng cần trần timeout; bỏ trống = về default implementation (khó lường)
      request: 15s
      backendRequest: 5s
  # Rule 2 - traffic chính: chia tải 90/10 stable vs canary
  - matches:
    - path:
        type: PathPrefix                    # ưu tiên PathPrefix/Exact hơn regex (regex phức tạp gây 404 toàn route - xem README)
        value: /
    backendRefs:
    - name: shop                            # Service mà BackendTLSPolicy(shop-backend-tls) sẽ verify TLS
      port: 8443                            # cổng tên "https" của Service shop
      weight: 90
    - name: shop-canary
      port: 8443
      weight: 10
    timeouts:
      request: 15s                          # timeout toàn request (client -> backend -> client); 0s = TẮT timeout (chờ vô hạn) theo spec
      backendRequest: 5s                    # timeout mỗi lần thử tới backend; phối hợp với retry trong BackendTrafficPolicy
