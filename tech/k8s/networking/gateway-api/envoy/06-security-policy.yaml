# =============================================================================
# SecurityPolicy - XÁC THỰC & PHÂN QUYỀN CHO HTTPRoute(shop-api)
# =============================================================================
# Vai trò: chèn lớp auth vào ĐÚNG route shop-api (không phải toàn Gateway), gồm
# JWT (xác thực) + CORS (cho browser) + authorization (chặn /admin theo role).
#
#   HTTPRoute(shop-api, app-team)   05-httproute.yaml
#        ▲ targetRefs (mức route -> chỉ shop-api bị áp auth, route khác không ảnh hưởng)
#   SecurityPolicy(shop-api-auth)
#
# Thứ tự FILTER mặc định EG: jwt_authn -> rbac(authorization) -> cors -> router (CORS chạy
# SAU JWT). Preflight OPTIONS (browser không kèm Bearer) bị JWT trả 401 TRƯỚC khi CORS kịp
# đáp -> hỏng CORS (issue gateway#2312; EG không bật bypass_cors_preflight). Vì vậy
# 01-envoy-proxy.yaml ĐÃ thêm filterOrder đẩy cors trước jwt_authn. Route cũng phải cho qua
# OPTIONS (05 match PathPrefix "/" nên OPTIONS lọt) thì filter CORS mới được gọi.
# =============================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: shop-api-auth
  namespace: app-team                       # cùng ns với HTTPRoute shop-api
spec:
  targetRefs:                               # bắt buộc 1 trong targetRefs / targetSelectors
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: shop-api                          # -> 05-httproute.yaml

  # --- JWT: xác thực token Bearer, reject 401 nếu sai/thiếu ---
  jwt:
    providers:
    - name: auth0                           # tên provider duy nhất - authorization.principal.jwt.provider trỏ lại tên này
      issuer: https://your-tenant.auth0.com/  # SAI issuer = mọi token bị reject 401 (phải khớp claim "iss")
      audiences:                            # token thiếu aud này -> reject; để trống = bỏ qua kiểm tra aud
      - https://api.shop.example.com
      remoteJWKS:
        uri: https://your-tenant.auth0.com/.well-known/jwks.json  # Envoy tự fetch + cache khóa công khai để verify chữ ký
      claimToHeaders:                       # copy claim sang header cho Service(shop) đọc, khỏi tự parse JWT
      - claim: sub
        header: x-user-sub
      - claim: email
        header: x-user-email
      recomputeRoute: false                 # (default: false) true = chạy lại route matching sau khi thêm header

  # --- CORS: cho phép browser tại shop.example.com gọi API ---
  cors:
    allowOrigins:
    - "https://shop.example.com"            # tránh "*" khi allowCredentials=true (browser sẽ chặn response)
    allowMethods:
    - GET
    - POST
    - OPTIONS                               # đây là Access-Control-Allow-Methods trả cho browser; preflight chạy được nhờ route cho qua OPTIONS + filterOrder (01), KHÔNG nhờ dòng này
    allowHeaders:
    - Authorization                         # cho phép gửi Bearer token mà JWT block ở trên cần
    - Content-Type
    exposeHeaders:
    - x-request-id                          # header backend trả về mà browser được phép đọc
    maxAge: 1h                              # cache kết quả preflight, giảm số OPTIONS request
    allowCredentials: true                  # (default: false) cho phép gửi cookie/Authorization kèm request

  # --- AUTHORIZATION: cho qua mặc định, riêng /admin yêu cầu role=admin ---
  # action của rule áp dụng KHI rule MATCH (principal AND operation), duyệt trên xuống, match
  # đầu tiên thắng. KHÔNG dùng 1 rule "Deny principal=role:admin": như vậy chặn ĐÚNG admin và
  # cho người KHÔNG-admin lọt vào /admin (ngược ý đồ). Cách đúng (allowlist trên /admin):
  # Allow admin -> /admin, rồi Deny phần còn lại trên /admin; path khác rơi về defaultAction.
  authorization:
    defaultAction: Allow                    # (default: Deny) - path != /admin cho qua (JWT đã xác thực ở trên)
    rules:
    - name: admin-allow                     # admin -> được vào /admin
      action: Allow
      principal:
        jwt:
          provider: auth0                   # tham chiếu jwt.providers[].name ở trên
          claims:
          - name: role
            valueType: String               # String | StringArray
            values: ["admin"]
      operation:
        paths: ["/admin"]
    - name: admin-deny-rest                 # còn lại (thiếu role=admin) -> chặn khỏi /admin
      action: Deny                          # rule chỉ có operation, không principal = match MỌI identity trên path này
      operation:
        paths: ["/admin"]
