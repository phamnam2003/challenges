# =============================================================================
# GatewayClass - LỚP NỀN CỦA STACK "shop API"
# =============================================================================
# Vai trò: khai báo "loại" Gateway nào sẽ do Envoy Gateway quản lý, và gắn cấu
# hình data plane (EnvoyProxy) cho toàn bộ Gateway thuộc class này.
#
# Vị trí trong chuỗi tham chiếu:
#   GatewayClass(eg) --parametersRef--> EnvoyProxy(prod-proxy)   [01-envoy-proxy.yaml]
#         ^
#         |  gatewayClassName: eg
#   Gateway(main-gateway)                                        [03-gateway.yaml]
#
# GatewayClass là cluster-scoped (không namespace). Khi Gateway đặt
# gatewayClassName: eg, controller đọc parametersRef ở đây để biết phải
# provision Envoy với cấu hình NodePort/HPA/telemetry trong 01-envoy-proxy.yaml.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg                                                        # Gateway tham chiếu qua gatewayClassName: eg
spec:
  # controllerName phải khớp CHÍNH XÁC chuỗi mà Envoy Gateway quảng bá.
  # Sai một ký tự = không controller nào nhận GatewayClass -> mọi Gateway treo ở trạng thái không Accepted.
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

  # parametersRef MỨC GATEWAYCLASS đã TẮT (chuyển sang attach mức Gateway ở 03-gateway.yaml).
  # Lý do: docs EG "discourage" gắn EnvoyProxy ở GatewayClass khi muốn mỗi Gateway một cấu
  # hình hạ tầng riêng; gắn ở Gateway (spec.infrastructure.parametersRef) hợp scope hơn và
  # khớp mô hình ops sở hữu gateway-infra (Gateway + EnvoyProxy cùng namespace). Nếu cả hai
  # cùng set thì Gateway-level THẮNG. Không set ở đâu cả = Envoy default (Service LoadBalancer,
  # không HPA) - không hợp bare-metal, nên 03 BẮT BUỘC có infrastructure.parametersRef.
  # Bỏ comment block dưới nếu muốn 1 cấu hình data plane CHUNG cho mọi Gateway của class:
  #
  # parametersRef:
  #   group: gateway.envoyproxy.io
  #   kind: EnvoyProxy
  #   name: prod-proxy
  #   namespace: gateway-infra                                   # GatewayClass cluster-scoped -> bắt buộc khai namespace
