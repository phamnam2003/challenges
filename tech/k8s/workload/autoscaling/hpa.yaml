apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-gate-hpa
  namespace: go-gate-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-gate-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80