# EnvoyProxy - CẤU HÌNH DATA PLANE (bare-metal on-prem)
# Vai trò: tùy biến Deployment/Service Envoy mà controller TỰ provision. Đây
# KHÔNG phải resource sinh traffic; nó là tham số (parametersRef) được Gateway
# trỏ tới qua spec.infrastructure.parametersRef -> controller đọc để biết cách
# dựng data plane (số replica, resource, kiểu Service, nodePort...).
#
# Đường đi traffic trên BARE-METAL (không có cloud LB):
#
#   client --> [nginx node ngoài] --proxy_pass--> NodePort 30080
#                                                     |
#                                                     v
#                                 Service(NodePort) của Envoy   <-- file này pin nodePort
#                                                     |
#                                                     v
#                                        Envoy pod[s]  (HPA 2..10)
#                                                     |
#                                                     v
#                            Gateway(main-gateway) -> HTTPRoute -> Service(app)
#
# Vì sao NodePort cố định: nginx node ngoài proxy_pass tới một cổng TĨNH. Để
# LoadBalancer (cần cloud) hoặc nodePort random -> upstream nginx lệch cổng mỗi
# lần Service tạo lại. Nginx tự cân tải giữa các node nên KHÔNG cần MetalLB/L2.
#
# THỨ TỰ APPLY: gc.yaml -> gw.yaml (tạo namespace gateway-infra) -> proxy.yaml.
# EnvoyProxy phải nằm cùng namespace với Gateway (parametersRef mức Gateway là
# LocalParametersReference, không có field namespace).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: prod-proxy                          # Gateway.spec.infrastructure.parametersRef trỏ vào tên này
  namespace: gateway-infra                  # cùng ns với Gateway; data plane (Deployment/Service) vẫn do controller tạo trong envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:

      # --- DEPLOYMENT --- không set replicas khi dùng HPA (HPA sở hữu số replica)
      envoyDeployment:
        container:
          resources:
            requests:                       # request = cơ sở scheduler đặt pod + tính HPA utilization
              cpu: 200m
              memory: 256Mi
            limits:                         # KHÔNG limit CPU cho proxy nhạy latency (tránh throttle); chỉ trần memory
              memory: 512Mi
          securityContext:
            runAsNonRoot: true              # củng cố default; EG vốn chạy Envoy non-root (lý do có cơ chế targetPort +10000)
            allowPrivilegeEscalation: false
        pod:
          # topologySpreadConstraints: trải đều pod Envoy các node, tránh mất hết khi 1 node chết.
          # Với externalTrafficPolicy: Cluster (dưới) đây chỉ phục vụ HA; nếu đổi sang Local thì thành BẮT BUỘC.
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway   # ưu tiên trải đều nhưng không chặn schedule khi thiếu node

      # --- HPA --- tự scale data plane theo tải; thay cho replicas tĩnh
      envoyHpa:
        minReplicas: 2                      # tối thiểu 2 cho HA; 1 pod chết vẫn còn phục vụ
        maxReplicas: 10
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70        # scale khi CPU trung bình vượt 70%

      # --- PDB --- bảo toàn tối thiểu khi drain/upgrade node, tránh downtime
      envoyPdb:
        minAvailable: 1                     # luôn giữ ít nhất 1 pod sẵn sàng khi voluntary disruption

      # --- SERVICE (BARE-METAL) --- điểm vào của nginx node ngoài
      envoyService:
        type: NodePort                      # bare-metal không có cloud LB; KHÔNG dùng LoadBalancer/MetalLB
        # Cluster: MỌI node nhận traffic NodePort rồi kube-proxy load-balance nội bộ
        # tới pod Envoy ở node bất kỳ. Đánh đổi: thêm 1 hop SNAT -> mất client IP thật
        # ở L4 (lấy lại qua X-Forwarded-For ở L7). Vì sao KHÔNG dùng Local:
        #  - Local chỉ mở cổng trên node đang chạy pod Envoy; nginx proxy_pass tới node
        #    rỗng pod -> connection refused.
        #  - HPA scale 2..10 + topologySpread ScheduleAnyway nên tập node-có-pod đổi liên
        #    tục; nginx upstream tĩnh không bám theo được.
        # Cần giữ client IP thật ở L4 thì mới đổi lại Local + cố định tập node có pod.
        externalTrafficPolicy: Cluster      # (default: Local)
        # Pin nodePort cố định: mặc định NodePort cấp cổng random 30000-32767.
        # StrategicMerge ghép theo key `name` -> chỉ sửa đúng port khớp, giữ nguyên
        # các port khác (an toàn cho trường hợp 1 listener). `name` = "<protocol>-<port>"
        # do EG sinh; sai `name` thì patch ÂM THẦM thêm port thừa thay vì sửa. VERIFY:
        #   kubectl -n envoy-gateway-system get svc \
        #     -l gateway.envoyproxy.io/owning-gateway-name=main-gateway -o yaml
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
              - name: http-80                # khớp listener "http" port 80 trong gw.yaml
                nodePort: 30080              # nginx: proxy_pass http -> <node>:30080

        # --- Khi terminate TLS TẠI ENVOY (bật listener https trong gw.yaml) ---
        # Thêm cổng https-443. Lúc đó có 2 port -> đổi sang JSONMerge (RFC 7396) vì nó
        # THAY NGUYÊN mảng ports (khai đủ 5 field mỗi entry), tránh key ghép không ổn định
        # khi nhiều port. Bỏ StrategicMerge ở trên và dùng block này:
        #
        # patch:
        #   type: JSONMerge
        #   value:
        #     spec:
        #       ports:
        #       - name: http-80
        #         port: 80
        #         targetPort: 10080          # EG đặt targetPort = listenerPort + 10000 (Envoy non-root)
        #         protocol: TCP
        #         nodePort: 30080
        #       - name: https-443
        #         port: 443
        #         targetPort: 10443
        #         protocol: TCP
        #         nodePort: 30443            # nginx: stream proxy_pass (passthrough) -> <node>:30443

  # --- SHUTDOWN --- drain kết nối cũ trước khi tắt, tránh đứt request khi rollout.
  # drainTimeout BẮT BUỘC < terminationGracePeriodSeconds (không set field đó -> dùng
  # default EG > 60s; đừng hạ xuống dưới drainTimeout).
  shutdown:
    drainTimeout: 60s                       # = default EG; để explicit cho dễ đọc
    minDrainDuration: 15s                   # > default EG (10s): thêm thời gian cho nginx kịp rút node khỏi rotation

  # --- LOGGING ---
  logging:
    level:
      default: warn                         # (default: warn) production để warn; bật info/debug khi điều tra

  # --- TELEMETRY --- Prometheus metrics bật sẵn; thêm access log JSON để phân tích
  telemetry:
    metrics:
      prometheus: {}                        # (default: bật) scrape ở :19001/stats/prometheus
    accessLog:
      settings:
      - format:
          type: JSON                        # JSON cho log collector parse dễ hơn Text
        sinks:
        - type: File
          file:
            path: /dev/stdout               # ghi ra stdout cho fluent-bit/loki thu gom

  # --- FILTER ORDER (chỉ cần khi thêm SecurityPolicy bật cả JWT lẫn CORS) ---
  # Mặc định EG xếp jwt_authn -> rbac -> cors, nên preflight OPTIONS (không kèm Bearer)
  # bị JWT trả 401 trước khi CORS đáp -> hỏng CORS cho SPA (issue gateway#2312). Bỏ comment
  # để đẩy cors chạy TRƯỚC jwt_authn. Để comment khi bộ core chưa có SecurityPolicy.
  # filterOrder:
  # - name: envoy.filters.http.cors
  #   before: envoy.filters.http.jwt_authn

  # --- BOOTSTRAP (re2) --- KHÔNG override. EG default đã set error_level ~ vô hạn
  # (4294967295) để chống lỗi "regex path match quá lớn gây 404 toàn route". Set giá trị
  # nhỏ hơn ở đây sẽ GÂY ĐÚNG lỗi đó -> để nguyên, ưu tiên PathPrefix/Exact hơn regex.
