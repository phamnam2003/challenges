# Secret credentials cho app user - CNPG bootstrap initdb đọc để tạo owner của DB.
# type kubernetes.io/basic-auth: BẮT BUỘC đúng 2 field username + password.
#
# CẢNH BÁO BẢO MẬT:
#   - KHÔNG commit mật khẩu thật vào git. File này chỉ là template; thay
#     <CHANGE_ME_STRONG_PASSWORD> rồi apply, và thêm file vào .gitignore.
#   - Cách an toàn hơn (không lưu file): tạo Secret bằng lệnh, không qua YAML:
#       kubectl -n cnpg-cluster create secret generic cnpg-cluster-credentials \
#         --type=kubernetes.io/basic-auth \
#         --from-literal=username=appuser \
#         --from-literal=password="$(openssl rand -base64 24)"
#   - Secret PHẢI tồn tại TRƯỚC khi apply Cluster (04); thiếu -> bootstrap lỗi.
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-cluster-credentials
  namespace: cnpg-cluster
type: kubernetes.io/basic-auth
stringData:
  username: appuser
  password: "<CHANGE_ME_STRONG_PASSWORD>"
